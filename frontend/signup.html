
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LIFEPRINT | Create Account</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">
            <h1>LIFEPRINT</h1>
            <p>Your Future, Simulated by AI</p>
        </div>

        <div class="auth-card">

            <div class="auth-heading">
                <h2>Create Your Account</h2>
                <p>Start your personalized career journey today.</p>
            </div>

            <form id="signupForm">

                <div class="auth-input-group">
                    <label for="signupName">Full Name</label>
                    <input
                        type="text"
                        id="signupName"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="auth-input-group">
                    <label for="signupEmail">Email Address</label>
                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="auth-input-group">
                    <label for="signupPassword">Password</label>
                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <div class="auth-input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        minlength="8"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <div class="auth-checkbox">
                    <input
                        type="checkbox"
                        id="showSignupPassword"
                    >
                    <label for="showSignupPassword">
                        Show passwords
                    </label>
                </div>

                <button type="submit" class="auth-button">
                    Create My Account →
                </button>

                <p id="signupMessage" class="auth-message"
                   role="status"></p>

            </form>

            <div class="auth-switch">
                <p>Already have an account?</p>
                <a href="login.html">Login here</a>
            </div>

        </div>

        <a href="index.html" class="auth-home-link">
            ← Back to Home
        </a>

    </div>

    <script src="js/signup.js"></script>

</body>
</html>
